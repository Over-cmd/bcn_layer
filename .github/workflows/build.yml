name: Compilar Layer con Makefile Nativo

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Clonar el repositorio
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    # 2. Instalar dependencias globales (make, xxd, glslangValidator, zstd)
    - name: Instalar Herramientas de Compilación
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential xxd glslang-tools zstd

    # 3. PARCHE DIRECTO C++: Añadir la declaración externa de instanceDispatch en bcn_layer.hpp si hace falta
    - name: Aplicar Parche de Enlace Externo a bcn_layer.hpp
      run: |
        if ! grep -q "extern std::unordered_map.*instanceDispatch" src/bcn_layer.hpp; then
          sed -i '/#include <cstring>/a \\nextern std::unordered_map<void *, VkLayerInstanceDispatchTable> instanceDispatch;' src/bcn_layer.hpp
          echo "¡Parche aplicado con éxito en bcn_layer.hpp!"
        fi

    # 4. COMPILACIÓN USANDO TU MAKEFILE
    - name: Compilar Proyecto con Make
      run: |
        # Ejecuta tu Makefile directamente (compila shaders y genera libbcn_layer.so)
        make -j$(nproc)

    # 5. Organizar y verificar binario .so
    - name: Organizar y Verificar Binario .so
      run: |
        mkdir -p release_package
        if [ -f "libbcn_layer.so" ]; then
          cp libbcn_layer.so release_package/
          echo "¡Éxito! libbcn_layer.so compilado correctamente."
          file release_package/libbcn_layer.so
        else
          echo "Error crítico: El Makefile no generó libbcn_layer.so."
          exit 1
        fi

        # Copiar el manifiesto JSON (o crearlo si falta)
        if [ -f "libbcn_layer.json" ]; then
          cp libbcn_layer.json release_package/
        else
          echo '{"file_format_version":"1.1.0","layer":{"name":"VK_LAYER_BCN_BCnLayer","type":"GLOBAL","library_path":"./libbcn_layer.so","api_version":"1.1.0","implementation_version":"1","description":"BCn Texture Decompression Compute Layer"}}' > release_package/libbcn_layer.json
        fi

    # 6. Empaquetar en layer.tzst
    - name: Empaquetar en layer.tzst
      run: |
        tar -I zstd -cf layer.tzst -C release_package .

    # 7. Subir artefacto final
    - name: Subir artefacto final
      uses: actions/upload-artifact@v4
      with:
        name: layer-tzst-bionic
        path: layer.tzst
        retention-days: 5
