name: Compilar Layer con Makefile Nativo y Extra Libs

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Clonar el repositorio
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    # 2. Instalar dependencias globales
    - name: Instalar Herramientas de Compilación y SDK de Vulkan
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential xxd glslang-tools zstd libvulkan-dev

    # 3. PARCHE DIRECTO C++: Añadir la declaración externa de instanceDispatch en bcn_layer.hpp
    - name: Aplicar Parche de Enlace Externo a bcn_layer.hpp
      run: |
        if ! grep -q "extern std::unordered_map.*instanceDispatch" src/bcn_layer.hpp; then
          sed -i '/#include <cstring>/a \\nextern std::unordered_map<void *, VkLayerInstanceDispatchTable> instanceDispatch;' src/bcn_layer.hpp
          echo "¡Parche aplicado con éxito en bcn_layer.hpp!"
        fi

    # 4. COMPILACIÓN USANDO TU MAKEFILE
    - name: Compilar Proyecto con Make
      run: |
        make -j$(nproc)

    # 5. ORGANIZAR ESTRUCTURA LIMPIA Y EXPLÍCITA (GARANTIZANDO USR/ EN LA RAÍZ)
    - name: Organizar estructura, reensamblar partes e inyectar capa
      run: |
        set -e
        # Limpiar cualquier resto anterior
        rm -rf pkg_root extra_libs.tzst

        # Crear la jerarquía exacta requerida por Winlator
        mkdir -p pkg_root/usr/lib
        mkdir -p pkg_root/usr/share/vulkan/implicit_layer.d
        mkdir -p pkg_root/usr/share/vulkan/icd.d

        # Copiar de forma explícita los archivos de librerías desde el repositorio
        if [ -d "extra_libs/usr/lib" ]; then
          cp -a extra_libs/usr/lib/* pkg_root/usr/lib/
        fi

        # Copiar de forma explícita las carpetas de configuración de Vulkan (json)
        if [ -d "extra_libs/usr/share/vulkan" ]; then
          cp -a extra_libs/usr/share/vulkan/. pkg_root/usr/share/vulkan/
        fi

        echo "--- Archivos detectados en pkg_root/usr/lib antes de unir ---"
        ls -la pkg_root/usr/lib/

        # Reconstruir libGL.so.1.5.0 a partir de las partes subidas
        if ls pkg_root/usr/lib/libGL.so.1.5.0.part* 1> /dev/null 2>&1; then
          echo "Reconstruyendo libGL.so.1.5.0 a partir de sus partes..."
          cat pkg_root/usr/lib/libGL.so.1.5.0.part* > pkg_root/usr/lib/libGL.so.1.5.0
          rm -f pkg_root/usr/lib/libGL.so.1.5.0.part*
          echo "¡libGL.so.1.5.0 reconstruido con éxito!"
        fi

        echo "--- Archivos detectados en pkg_root/usr/lib después de unir ---"
        ls -la pkg_root/usr/lib/

        # Inyectar libbcn_layer.so recién compilado en usr/lib/
        if [ -f "libbcn_layer.so" ]; then
          cp libbcn_layer.so pkg_root/usr/lib/
          echo "¡Éxito! libbcn_layer.so añadido a pkg_root/usr/lib/."
        else
          echo "Error crítico: El Makefile no generó libbcn_layer.so."
          exit 1
        fi

        # Copiar o generar el manifiesto JSON de la capa
        if [ -f "libbcn_layer.json" ]; then
          cp libbcn_layer.json pkg_root/usr/share/vulkan/implicit_layer.d/
        else
          echo '{"file_format_version":"1.1.0","layer":{"name":"VK_LAYER_BCN_BCnLayer","type":"GLOBAL","library_path":"./libbcn_layer.so","api_version":"1.1.0","implementation_version":"1","description":"BCn Texture Decompression Compute Layer"}}' > pkg_root/usr/share/vulkan/implicit_layer.d/libbcn_layer.json
        fi

    # 6. EMPAQUETAR TODO EN extra_libs.tzst (Con usr/ directamente en la raíz)
    - name: Empaquetar en extra_libs.tzst
      run: |
        tar -I zstd -cf extra_libs.tzst -C pkg_root .

    # 7. SUBIR ARTEFACTO FINAL
    - name: Subir artefacto final
      uses: actions/upload-artifact@v4
      with:
        name: extra-libs-package
        path: extra_libs.tzst
        retention-days: 5
