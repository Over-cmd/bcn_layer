name: Compilar Layer con Makefile Nativo

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Clonar el repositorio
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    # 2. Instalar dependencias globales (make, xxd, glslangValidator, zstd, libvulkan-dev)
    - name: Instalar Herramientas de Compilación y SDK de Vulkan
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential xxd glslang-tools zstd libvulkan-dev

    # 3. COMPILACIÓN USANDO TU MAKEFILE
    - name: Compilar Proyecto con Make
      run: |
        make -j$(nproc)

    # 4. Organizar y verificar binario .so con limpieza previa
    - name: Organizar y Verificar Binario .so
      run: |
        set -e
        # Limpiar restos anteriores para evitar corrupción
        rm -rf release_package extra_libs.tzst

        mkdir -p release_package/usr/lib
        mkdir -p release_package/usr/share/vulkan/implicit_layer.d

        if [ -f "libbcn_layer.so" ]; then
          cp libbcn_layer.so release_package/usr/lib/
          echo "¡Éxito! libbcn_layer.so compilado correctamente."
          file release_package/usr/lib/libbcn_layer.so
        else
          echo "Error crítico: El Makefile no generó libbcn_layer.so."
          exit 1
        fi

        # Copiar el manifiesto JSON (o crearlo si falta)
        if [ -f "libbcn_layer.json" ]; then
          cp libbcn_layer.json release_package/usr/share/vulkan/implicit_layer.d/
        else
          echo '{"file_format_version":"1.1.0","layer":{"name":"VK_LAYER_BCN_BCnLayer","type":"GLOBAL","library_path":"./libbcn_layer.so","api_version":"1.1.0","implementation_version":"1","description":"BCn Texture Decompression Compute Layer"}}' > release_package/usr/share/vulkan/implicit_layer.d/libbcn_layer.json
        fi

    # 5. EMPAQUETAR USANDO PIPE ROBUSTO (TAR + ZSTD)
    - name: Empaquetar en extra_libs.tzst
      run: |
        tar -cf - -C release_package usr | zstd -T0 > extra_libs.tzst

    # 6. Subir artefacto final
    - name: Subir artefacto final
      uses: actions/upload-artifact@v4
      with:
        name: extra-libs-package
        path: extra_libs.tzst
        retention-days: 5
