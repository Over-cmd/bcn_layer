name: Compilar Bcn Layer con Makefile Nativo

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Clonar el repositorio
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    # 2. Instalar dependencias globales
    - name: Instalar Herramientas de Compilación y SDK de Vulkan
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential xxd glslang-tools zstd libvulkan-dev

    # 3. Compilar el proyecto con Make
    - name: Compilar Proyecto con Make
      run: |
        make -j$(nproc)

    # 4. Organizar carpetas separadas (usr/lib y usr/share/vulkan/implicit_layer.d)
    - name: Organizar Estructura Separada
      run: |
        set -e
        rm -rf release_package extra_libs.tzst

        # Crear ambas carpetas de forma independiente
        mkdir -p release_package/usr/lib
        mkdir -p release_package/usr/share/vulkan/implicit_layer.d

        # Copiar el binario .so estrictamente en usr/lib/
        if [ -f "libbcn_layer.so" ]; then
          cp -fv libbcn_layer.so release_package/usr/lib/
          file release_package/usr/lib/libbcn_layer.so
        else
          echo "Error crítico: El Makefile no generó libbcn_layer.so."
          exit 1
        fi

        # Crear el JSON exacto con "library_path": "libbcn_layer.so" como el original
        cat << 'EOF' > release_package/usr/share/vulkan/implicit_layer.d/libbcn_layer.json
        {
          "file_format_version" : "1.0.0",
          "layer" : {
            "name": "VK_LAYER_BCN_BCnLayer",
            "type": "GLOBAL",
            "library_path": "libbcn_layer.so",
            "api_version": "1.0.0",
            "implementation_version": "1",
            "description": "BCn Decompression Layer",
            "functions": {
              "vkGetInstanceProcAddr": "BCnLayer_GetInstanceProcAddr",
              "vkGetDeviceProcAddr": "BCnLayer_GetDeviceProcAddr"
            },
            "enable_environment": {
              "ENABLE_BCN_COMPUTE": "1"
            },
            "disable_environment": {
              "DISABLE_BCN_COMPUTE": "1"
            }
          }
        }
        EOF

    # 5. Empaquetar usando el método exacto validado
    - name: Empaquetar en extra_libs.tzst
      run: |
        cd release_package 
        tar -I 'zstd -19 -T0' -cf ../extra_libs.tzst usr/ 
        cd ..
        echo "-> ¡Paquete extra_libs.tzst forjado con éxito!"

    # 6. Subir artefacto final
    - name: Subir artefacto final
      uses: actions/upload-artifact@v4
      with:
        name: extra-libs-package
        path: extra_libs.tzst
        retention-days: 5
